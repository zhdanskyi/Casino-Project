<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Casino Royale</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* estilos extra para el perfil */
        .profile-panel {
            padding: 40px;
            border-radius: var(--radius-lg);
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .profile-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent-primary);
        }
        .deposit-section {
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .deposit-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .deposit-buttons .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        
        <!-- sidebar igual que en index -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="neon-text">C</span>asino
                </div>
                <button id="btn-toggle-sidebar" class="btn-icon" aria-label="Colapsar menú">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="index.html"><span class="icon">🎰</span> <span class="nav-text">Juegos</span></a></li>
                    <li><a href="#"><span class="icon">🎁</span> <span class="nav-text">Promociones</span></a></li>
                    <li><a href="#"><span class="icon">👑</span> <span class="nav-text">Club VIP</span></a></li>
                    <li><a href="#"><span class="icon">🏆</span> <span class="nav-text">Torneos</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- contenedor principal -->
        <div class="main-content">
            
            <!-- topbar -->
            <header class="topbar">
                <div class="search-container">
                    <input type="search" placeholder="Buscar juegos..." class="search-input">
                </div>
                
                <div class="user-controls">
                    <div class="balance-container glass-effect">
                        <span id="user-balance" class="balance-amount">0.00</span>
                        <span id="user-currency" class="balance-currency">€</span>
                        <button id="btn-add-funds" class="btn-add">+</button>
                    </div>
                    
                    <div class="user-profile" id="user-profile-btn">
                        <img id="user-avatar" src="" alt="Avatar" class="avatar">
                        <span id="user-name" class="username">Usuario</span>
                    </div>
                </div>
            </header>

            <!-- contenido perfil -->
            <main>
                <div class="profile-panel glass-effect">
                    <div class="profile-header">
                        <img id="profile-page-avatar" src="" alt="Avatar">
                        <div>
                            <h2 id="profile-page-name" class="neon-text">Cargando...</h2>
                            <p style="color: var(--text-secondary)">Miembro VIP</p>
                        </div>
                    </div>

                    <div class="deposit-section">
                        <h3>Ingreso Rápido de Saldo</h3>
                        <p style="color: var(--text-secondary); margin-top: 5px; font-size: 0.9em;">Añade fondos a tu cuenta al instante.</p>
                        <div class="deposit-buttons">
                            <button class="btn btn-secondary btn-deposit" data-amount="50">+ 50€</button>
                            <button class="btn btn-primary btn-deposit" data-amount="100">+ 100€</button>
                            <button class="btn btn-primary btn-deposit" style="background: var(--accent-secondary);" data-amount="500">+ 500€</button>
                        </div>
                    </div>
                </div>
            </main>
            
        </div>
    </div>

    <script type="module" src="perfil.js"></script>
</body>
</html>
