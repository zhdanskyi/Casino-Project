<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Poker | CasinoHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/modal.css">
    <style>
        .poker-view {
            background: radial-gradient(circle, #004d00 0%, #001a00 100%);
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .poker-table {
            width: 100%;
            height: 100%;
            border: 10px solid #5c3a21;
            border-radius: 200px;
            background: #0a5223;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(0,255,0,0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .cards-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 120px;
        }

        .playing-card {
            width: 80px;
            height: 120px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px 10px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            position: relative;
        }

        .playing-card.red {
            color: #ff0000;
        }

        .card-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
        }

        .card-bottom-right {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        .card-back {
            background: repeating-linear-gradient(45deg, #0000aa, #0000aa 10px, #0000dd 10px, #0000dd 20px);
            border: 4px solid #fff;
            color: transparent;
        }

        .poker-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            z-index: 10;
        }

        .poker-actions button {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .btn-fold { background: #ff3333; color: #fff; }
        .btn-call { background: #33cc33; color: #fff; }
        .btn-raise { background: #ffcc00; color: #000; }

        .game-status {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        .poker-chip {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #eab308 30%, #b45309 90%);
            border: 3px dashed #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            margin: -5px;
            transition: all 0.3s ease;
        }
        
        .community-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 120px;
            margin: 20px 0;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 480px;
        }
        
        .pot-container {
            position: absolute;
            top: 50%;
            left: 15%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .pot-amount {
            color: #eab308;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
            <header class="topbar">
        <div class="topbar-content">
            <div class="topbar-left">
                <!-- Logo del Casino -->
                <a href="../index.html" class="topbar-logo" style="text-decoration: none;">
                    <i class="fa-solid fa-dice-d20"></i> <span class="logo-text">CasinoHub</span>
                </a>

                <!-- Enlaces de NavegaciÃ³n -->
                <nav class="topbar-nav" id="mobileNav">
                    <a href="../index.html" class="nav-item">
                        <i class="fa-solid fa-house"></i> Inicio
                    </a>

                    <!-- MenÃº Desplegable para Juegos -->
                    <div class="mega-menu-wrapper">
                        <a href="../index.html#games-section" class="nav-item active">
                            <i class="fa-solid fa-gamepad"></i> Juegos <i class="fa-solid fa-chevron-down"
                                style="font-size: 12px; margin-left: 5px;"></i>
                        </a>

                        <div class="mega-menu">
                            <a href="aviator.html" class="mega-menu-item">
                                <img src="../assets/images/games/aviator.jpg" alt="Aviator">
                                Aviator
                            </a>
                            <a href="poker.html" class="mega-menu-item">
                                <img src="../assets/images/games/poker.jpg" alt="Poker">
                                Cyber Poker
                            </a>
                            <a href="mines.html" class="mega-menu-item">
                                <img src="../assets/images/games/mines.jpg" alt="Mines">
                                Mines
                            </a>
                            <a href="rocket.html" class="mega-menu-item">
                                <img src="../assets/images/games/rocket.jpg" alt="Rocket">
                                Rocket Crash
                            </a>
                            <a href="slots.html" class="mega-menu-item">
                                <img src="../assets/images/games/slots.jpg" alt="Slots">
                                Slots
                            </a>
                        </div>
                    </div>

                    <a href="bonuses.html" class="nav-item">
                        <i class="fa-solid fa-gift"></i> Promociones
                    </a>
                </nav>
            </div>

            <div class="topbar-right">
                <!-- Controles de Usuario (Saldo y Perfil) -->
                <div class="user-controls">
                    <div class="balance-display">
                        <i class="fa-solid fa-wallet"></i>
                        <span id="userBalance" class="balance-amount">0.00 EUR</span>
                    </div>
                    <button id="addFundsBtn" class="add-funds-btn"><i class="fa-solid fa-plus add-funds-icon"
                            style="display:none;"></i><span class="add-funds-text">+ Añadir Saldo</span></button>
                    <a href="profile.html" class="user-profile-btn" style="cursor: pointer;">
                        <div class="user-avatar" id="userAvatarBtn">?</div>
                        <span id="userNameBtn">Invitado</span>
                    </a>
                </div>

                <!-- BotÃ³n de MenÃº MÃ³vil -->
                <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="game-layout">
            <div class="game-sidebar">
                <div class="bet-controls">
                    <h3>Apuesta Poker</h3>
                    <div class="input-group">
                        <label>Apuesta Inicial (EUR)</label>
                        <input type="number" id="betAmount" value="5.00" step="1.00" min="1.00">
                    </div>
                    <button id="btnDeal" class="btn-primary w-100 mt-20">REPARTIR</button>
                </div>
            </div>

            <div class="game-view poker-view">
                <div class="poker-table">
                    <!-- Dealer cards -->
                    <div class="cards-container" id="dealerCards">
                        <div class="playing-card card-back"></div>
                        <div class="playing-card card-back"></div>
                    </div>
                    
                    <div class="pot-container">
                        <div id="potChips" style="display: flex; flex-wrap: wrap; width: 80px; justify-content: center;"></div>
                        <div class="pot-amount" id="potAmountText">Bote: 0€</div>
                    </div>

                    <div id="pokerStatus" class="game-status">Esperando apuesta...</div>
                    
                    <!-- Community Cards -->
                    <div class="community-area" id="communityCards">
                        <!-- injected by JS -->
                    </div>

                    <!-- Player cards -->
                    <div class="cards-container" id="playerCards">
                        <div class="playing-card card-back"></div>
                        <div class="playing-card card-back"></div>
                    </div>
                </div>

                <div class="poker-actions" id="pokerActions" style="display: none;">
                    <button id="btnFold" class="btn-fold">Retirarse</button>
                    <button id="btnCall" class="btn-call">Igualar</button>
                    <button id="btnRaise" class="btn-raise">Subir (x2)</button>
                </div>
            </div>
        </div>
    </main>

    

    <!-- Modales Globales -->
    <dialog id="wallet-modal" class="modal">
        <div class="modal-content glass-effect">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <img id="wallet-avatar" src="" alt="Avatar"
                    style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid #0ea5e9;">
                <div style="text-align: left;">
                    <h3 id="wallet-name" class="neon-text" style="margin-bottom: 5px;">Usuario</h3>
                    <p style="color: #94a3b8; font-size: 0.9em;">Miembro VIP</p>
                <button id="btn-logout" class="btn-secondary" style="border: 1px solid #ef4444; color: #ef4444; padding: 4px 8px; font-size: 0.8em; cursor: pointer; border-radius: 4px; margin-top: 5px;">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
                </div>
                <button id="btn-close-wallet" class="btn-icon" style="margin-left: auto; align-self: flex-start;">
                    <i class="fa-solid fa-xmark" style="font-size: 24px;"></i>
                </button>
            </div>

            <!-- Tabs de navegacion -->
            <div class="wallet-tabs">
                <button class="wallet-tab active" data-tab="deposit">Depósito</button>
                <button class="wallet-tab" data-tab="withdraw">Retiro</button>
                <button class="wallet-tab" data-tab="history">Historial</button>
            </div>

            <div class="wallet-body">
                <!-- Contenedor general de saldo, se mantiene comun en deposito y retiro -->
                <div class="wallet-balance-box">
                    <p>Saldo Actual</p>
                    <div class="balance-display">
                        <span id="wallet-balance">0.00</span> <span class="currency">€</span>
                    </div>
                </div>

                <!-- Tab Deposito / Retiro (comparten estructura) -->
                <div id="tab-transaction" class="tab-content active">
                    <div class="transaction-form">
                        <label id="transaction-label">Cantidad a ingresar</label>
                        <div class="input-group">
                            <input type="number" id="transaction-input" placeholder="0.00" min="0" step="10">
                            <span class="currency-addon">€</span>
                        </div>

                        <div class="quick-amounts">
                            <button class="btn-quick" data-val="10">+10</button>
                            <button class="btn-quick" data-val="50">+50</button>
                            <button class="btn-quick" data-val="100">+100</button>
                            <button class="btn-quick" id="btn-max-amount">MAX</button>
                        </div>

                        <button id="btn-confirm-transaction" class="btn-primary btn-full"
                            style="border: none; cursor: pointer;">Confirmar Transacción</button>
                        <p id="transaction-msg" class="transaction-msg"></p>
                    </div>
                </div>

                <!-- Tab Historial -->
                <div id="tab-history" class="tab-content" style="display: none;">
                    <ul id="wallet-transactions" class="history-list">
                        <!-- transacciones inyectadas por js -->
                    </ul>
                </div>
            </div>
        </div>
    </dialog>
    <dialog id="login-modal" class="modal">
        <div class="modal-content glass-effect" style="margin: auto;">
            <div style="margin-bottom: 30px;">
                <i class="fa-solid fa-user-circle"
                    style="font-size: 40px; color: var(--magenta); margin-bottom: 15px;"></i>
                <h2 class="neon-text">Bienvenido a CasinoHub</h2>
                <p style="color: #94a3b8; margin-top: 10px;">Selecciona tu perfil o crea uno nuevo</p>
            </div>

            <div id="profiles-list"
                style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px;">
                <!-- Los perfiles se inyectan aquí mediante JS -->
            </div>

            <div
                style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <h4 style="margin-bottom: 15px; color: #94a3b8;">Crear nuevo perfil</h4>
                <div class="input-group" style="margin-bottom: 15px;">
                    <input type="text" id="new-profile-name" placeholder="Tu nombre..."
                        style="flex: 1; background: transparent; border: none; color: #fff; padding: 12px; outline: none;">
                </div>
                <button id="btn-create-profile" class="btn-primary"
                    style="width: 100%; border: none; cursor: pointer;">Registrarse y Jugar</button>
            </div>
            <button id="btn-close-login" class="btn-secondary"
                style="margin-top: 15px; width: 100%; cursor: pointer;">Cerrar</button>
        </div>
    </dialog>

    <div id="toast-container"></div>

    <script src="../js/utils/random.js"></script>
    <script src="../js/utils/formatter.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/games/poker.js"></script>
</body>
</html>
