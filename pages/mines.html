<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Mines | CasinoHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .mines-view {
            background: linear-gradient(135deg, #111, #222);
            flex-direction: column;
            gap: 20px;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--magenta);
        }

        .mine-tile {
            width: 60px;
            height: 60px;
            background: var(--bg-card);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: all 0.2s;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
            border: 1px solid var(--border);
        }

        .mine-tile:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .mine-tile.revealed-gem {
            background: rgba(0, 255, 0, 0.2);
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            cursor: default;
        }

        .mine-tile.revealed-bomb {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            cursor: default;
        }

        .game-status {
            font-size: 20px;
            color: var(--cyan);
            height: 30px;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-dice-d20"></i> CasinoHub
        </div>
        <nav class="sidebar-nav">
            <a href="../index.html" class="nav-item">
                <i class="fa-solid fa-house"></i> Inicio
            </a>
            <a href="../index.html#games-section" class="nav-item active">
                <i class="fa-solid fa-gamepad"></i> Juegos
            </a>
            <a href="bonuses.html" class="nav-item">
                <i class="fa-solid fa-gift"></i> Promociones
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i> Perfil
            </a>
        </nav>
    </aside>

    <header class="topbar">
        <div class="user-controls">
            <div class="balance-display">
                <i class="fa-solid fa-wallet"></i>
                <span id="userBalance" class="balance-amount">0.00 EUR</span>
            </div>
            <button id="addFundsBtn" class="add-funds-btn">+ Añadir Saldo</button>
            <a href="profile.html" class="user-profile-btn">
                <div class="user-avatar" id="userAvatarBtn">J</div>
                <span id="userNameBtn">Jugador</span>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="game-layout">
            <div class="game-sidebar">
                <div class="bet-controls">
                    <h3>Apuesta Mines</h3>
                    <div class="input-group">
                        <label>Importe (EUR)</label>
                        <input type="number" id="betAmount" value="5.00" step="1.00" min="1.00">
                    </div>
                    <button id="btnPlay" class="btn-primary w-100 mt-20">Jugar</button>
                    <button id="btnCashout" class="btn-success w-100 mt-20 hidden">Retirar</button>
                </div>
            </div>

            <div class="game-view mines-view">
                <div id="gameStatus" class="game-status">Esperando apuesta...</div>

                <div class="mines-grid" id="minesGrid">
                    <!-- Tiles will be generated here -->
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="../js/utils/random.js"></script>
    <script src="../js/utils/formatter.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/games/mines.js"></script>
</body>

</html>
